version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: interview_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: interview_platform
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: interview_redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: interview_server
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/interview_platform
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: interview_client
    ports:
      - '80:80'
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo_data:
